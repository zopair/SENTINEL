name: Render SENTINEL explainer

on:
  pull_request:
    paths:
      - "media/**"
      - ".github/workflows/render-explainer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-explainer-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: media/requirements.txt

      - name: Install system rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Manim
        run: python -m pip install -r media/requirements.txt

      - name: Render 1080p 60fps explainer
        run: |
          manim -qh --fps 60 --resolution 1920,1080 \
            media/sentinel_explainer.py SentinelExplainer

      - name: Collect MP4
        run: |
          mkdir -p rendered
          find media -type f -name 'SentinelExplainer.mp4' -exec cp {} rendered/SENTINEL-explainer-1080p-60fps.mp4 \;
          test -s rendered/SENTINEL-explainer-1080p-60fps.mp4

      - name: Create autoplaying repository preview
        run: |
          ffmpeg -y -i rendered/SENTINEL-explainer-1080p-60fps.mp4 -vf "fps=10,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" -loop 0 rendered/sentinel-preview.gif
          test -s rendered/sentinel-preview.gif

      - name: Publish rendered MP4 into the source branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp rendered/SENTINEL-explainer-1080p-60fps.mp4 media/SENTINEL-explainer.mp4
          cp rendered/sentinel-preview.gif media/sentinel-preview.gif
          git add media/SENTINEL-explainer.mp4 media/sentinel-preview.gif
          if git diff --cached --quiet; then
            echo "Rendered MP4 is already current."
          else
            git commit -m "Publish generated SENTINEL explainer video"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-explainer-1080p-60fps
          path: rendered/SENTINEL-explainer-1080p-60fps.mp4
          if-no-files-found: error
          retention-days: 30
