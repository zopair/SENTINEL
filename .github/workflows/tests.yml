name: tests-and-security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development checks
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install -e ".[dev]"
      - name: Run unit and property-based tests
        run: pytest
      - name: Static security analysis (Bandit)
        run: bandit -r sentinel -q
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  linux-isolation-and-agent-sim:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Podman and rootless prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -gn):" /etc/subgid; then
            echo "$(id -gn):100000:65536" | sudo tee -a /etc/subgid
          fi
      - name: Verify rootless Podman
        run: |
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"
      - name: Build synthetic-only image
        run: podman build -f lab/podman/Containerfile -t sentinel-core:ci .
      - name: Build pinned agent fixture image
        run: podman build -f lab/podman/AgentFixture.Containerfile -t sentinel-agent-fixture:ci .
      - name: Exercise containment gateway against bounded adversarial fixtures
        env:
          PYTHONPATH: .
        run: |
          AGENT_IMAGE="$(podman image inspect --format '{{.Id}}' sentinel-agent-fixture:ci)"
          case "$AGENT_IMAGE" in sha256:*) ;; *) AGENT_IMAGE="sha256:$AGENT_IMAGE" ;; esac
          SENTINEL_FIXTURE_IMAGE="$AGENT_IMAGE" python3 - <<'PY'
          import json
          import os
          import subprocess
          from sentinel.containment import AgentRunSpec, ContainmentPolicy, PodmanRunner

          image = os.environ["SENTINEL_FIXTURE_IMAGE"]
          runner = PodmanRunner()
          def run(mode, policy=None):
              return runner.run(AgentRunSpec(
                  image=image, command=[mode], policy=policy or ContainmentPolicy()
              ))

          probe = run("probe")
          assert probe.status == "completed" and probe.exit_code == 0, probe
          facts = json.loads(probe.output)
          assert facts["non_root"] and facts["capabilities_zero"]
          assert facts["no_new_privileges"] and facts["filesystem_write_blocked"]
          assert facts["network_blocked"], facts

          output = run("output", ContainmentPolicy(output_limit_bytes=1024))
          assert output.status == "output_limit_exceeded"
          assert output.output_truncated and len(output.output.encode()) == 1024

          timed = run("sleep", ContainmentPolicy(timeout_seconds=1))
          assert timed.status == "timed_out"

          quota = run("tmpfs", ContainmentPolicy(tmpfs_mb=1))
          assert quota.status == "completed" and quota.exit_code == 0, quota
          quota_bytes = json.loads(quota.output)["bytes_written_before_limit"]
          assert quota_bytes <= 2 * 1024 * 1024, quota_bytes

          pids = run("process_limit", ContainmentPolicy(pids_limit=16))
          assert pids.status == "completed" and pids.exit_code == 0, pids
          assert json.loads(pids.output)["children_created"] < 96

          child = run("child_sleep", ContainmentPolicy(timeout_seconds=1))
          assert child.status == "timed_out"
          leftovers = subprocess.run(
              ["podman", "ps", "-a", "--filter", "name=sentinel-agent-", "--format", "{{.ID}}"],
              check=True, capture_output=True, text=True, timeout=10,
          )
          assert not leftovers.stdout.strip(), leftovers.stdout
          print("PASS: deny-by-default probe, output/tmpfs/PID limits, timeout, and disposable-container cleanup")
          PY
      - name: Verify effective container configuration
        run: |
          chmod +x lab/podman/preflight.sh
          SENTINEL_IMAGE=sentinel-core:ci ./lab/podman/preflight.sh
      - name: Verify runtime containment properties
        run: |
          HOST_NETNS="$(stat -Lc '%i' /proc/self/ns/net)"
          podman run --rm \
            --network=none --read-only --cap-drop=all \
            --security-opt=no-new-privileges \
            --pids-limit=64 --memory=128m --cpus=0.50 \
            --user=10001:10001 \
            --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=16m \
            -e SENTINEL_HOST_NETNS="$HOST_NETNS" \
            --entrypoint python sentinel-core:ci \
            /app/lab/podman/containment_probe.py
      - name: Run agents only inside the verified sandbox profile
        run: |
          chmod +x lab/podman/run-agent-simulation.sh
          SENTINEL_IMAGE=sentinel-core:ci ./lab/podman/run-agent-simulation.sh

  reproducible-benchmark:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install SENTINEL
        run: python -m pip install .
      - name: Run matched 30-seed six-policy benchmark
        run: |
          sentinel compare --seeds $(seq 1 30) --steps 20 --max-nodes 64 --max-depth 8 --branching-factor 3 --jsonl > sentinel-results.jsonl
          test -s sentinel-results.jsonl
      - name: Upload reproducible benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-six-policy-results-${{ github.sha }}
          path: sentinel-results.jsonl
          if-no-files-found: error
          retention-days: 90
