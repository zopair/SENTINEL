name: tests-and-security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development checks
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install -e ".[dev]"
      - name: Run unit and property-based tests
        run: pytest
      - name: Static security analysis (Bandit)
        run: bandit -r sentinel -q
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

