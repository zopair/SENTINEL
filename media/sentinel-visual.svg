    <g fill="#101e2a" stroke="#d4af37" stroke-width="3">
      <circle cx="100" cy="225" r="13"/><circle cx="220" cy="110" r="11"/><circle cx="365" cy="205" r="12"/><circle cx="500" cy="95" r="11"/><circle cx="650" cy="205" r="12"/><circle cx="790" cy="115" r="11"/><circle cx="955" cy="220" r="13"/><circle cx="220" cy="340" r="10"/><circle cx="500" cy="330" r="10"/><circle cx="790" cy="335" r="10"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-width="5" filter="url(#glow)">
      <path d="M100 225L220 110L365 205L500 95L650 205L790 335" stroke="#d4af37"/>
      <path d="M100 225L220 340L365 205L500 330L650 205L790 115" stroke="#55d8c9"/>
      <path d="M100 225L365 205L500 330L790 335L955 220" stroke="#9a82db" stroke-opacity=".9"/>
      <path d="M100 225L220 110L500 95L790 115L955 220" stroke="#e59b67" stroke-opacity=".9"/>
      <path d="M100 225L220 340L500 330L650 205L955 220" stroke="#79a8ed" stroke-opacity=".9"/>
      <path d="M100 225L365 205L650 205L790 115L955 220" stroke="#f0d58a" stroke-opacity=".9"/>
    </g>
    <circle cx="100" cy="225" r="25" fill="none" stroke="#4ee5d0" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="275" text-anchor="middle" fill="#4ee5d0" font-size="13" letter-spacing="2">ENTRY</text>
