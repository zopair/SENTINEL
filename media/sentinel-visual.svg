<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">SENTINEL — Adaptive Cyber Deception Research</title>
<desc id="desc">A bounded synthetic labyrinth with six deterministic exploration paths, decoy nodes, and a protected real-assets boundary.</desc>
<defs>
  <radialGradient id="bg" cx="52%" cy="42%" r="75%"><stop offset="0" stop-color="#142a3a"/><stop offset=".62" stop-color="#0b111a"/><stop offset="1" stop-color="#070a10"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5dfa0"/><stop offset="1" stop-color="#b58b2a"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4ee5d0"/><stop offset="1" stop-color="#8af5df"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284052" stroke-opacity=".24" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect width="1200" height="760" rx="28" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
