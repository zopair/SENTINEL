      <path d="M100 225L220 340L365 205L500 330L650 205L790 335L955 220"/>
      <path d="M220 110L220 340M500 95L500 330M790 115L790 335M365 205L650 205"/>
      <path d="M100 225L365 205L500 95L790 115L955 220"/>
